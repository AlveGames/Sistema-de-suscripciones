{% extends "base.html" %}
{% block contenido %}
<h1>Eliminar servicio</h1>
<p>¿Seguro que deseas eliminar <strong>{{ object }}</strong>?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Sí, eliminar</button>
  <a href="{% url 'servicios:index' %}">Cancelar</a>
</form>
{% endblock %}
