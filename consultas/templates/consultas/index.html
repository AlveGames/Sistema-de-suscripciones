{% extends "core/base.html" %}
{% block titulo %}Consultas{% endblock %}
{% block encabezado %}Consultas del negocio{% endblock %}

{% block contenido %}
<div class="indicadores" style="grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));">
  {% for c in consultas %}
    <div class="tarjeta" style="margin-bottom: 0; display: flex; flex-direction: column;">
      <p style="margin-top: 0;"><span class="etiqueta verde">Consulta {{ c.numero }}</span></p>
      <h2>{{ c.titulo }}</h2>
      <p class="ayuda" style="flex: 1;">{{ c.pregunta }}</p>
      <div><a class="boton" href="{% url c.url %}">Ver</a></div>
    </div>
  {% endfor %}
</div>
{% endblock %}
