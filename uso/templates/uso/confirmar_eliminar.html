{% extends "core/base.html" %}
{% block titulo %}Eliminar{% endblock %}
{% block encabezado %}Eliminar registro{% endblock %}

{% block contenido %}
<div class="tarjeta">
  <p>¿Seguro que quieres eliminar <strong>{{ object }}</strong>? Esta acción no se puede deshacer.</p>
  <form method="post">
    {% csrf_token %}
    <div class="botones-form">
      <button class="boton peligro" type="submit">Sí, eliminar</button>
      <a class="boton secundario" href="{% url 'uso:index' %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
